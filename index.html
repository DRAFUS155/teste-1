<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG de Texto Interativo</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="text-center my-4">
            <h1>RPG de Texto Interativo</h1>
        </header>

        <main>
            <div id="jogo-container">
                <div id="historia" class="mb-3 p-3 border rounded bg-light" style="min-height: 200px; max-height: 400px; overflow-y: auto;">
                    <!-- A história do jogo será exibida aqui -->
                    <p>Carregando história...</p>
                </div>

                <div id="opcoes" class="mb-3">
                    <!-- As opções do jogador serão exibidas aqui como botões -->
                </div>

                <div id="entrada-jogador-container" class="mb-3">
                    <textarea id="input-jogador" class="form-control" rows="3" placeholder="Descreva sua ação ou digite seu comando..."></textarea>
                    <div id="botoes-acao-container" class="mt-2 d-flex justify-content-start flex-wrap">
                        <button id="enviar-acao" class="btn btn-primary mr-2 mb-2" style="flex-basis: calc(50% - 0.5rem);">Enviar Ação</button>
                        <button id="salvar-jogo-button" class="btn btn-success mr-2 mb-2" style="flex-basis: calc(50% - 0.5rem);">Salvar Jogo</button>
                        <button id="carregar-jogo-button" class="btn btn-info mr-2 mb-2" style="flex-basis: calc(50% - 0.5rem);">Carregar Jogo</button>
                        <!-- Adicionar mais botões aqui se necessário, ajustando flex-basis -->
                    </div>
                </div>
            </div>

            <div id="status-personagem-container" class="mt-4 p-3 border rounded bg-light">
                <h4>Status do Personagem</h4>
                <div id="status-personagem">
                    <!-- Informações do personagem (nome, nível, HP, etc.) serão exibidas aqui -->
                    <p>Nome: <span id="nome-jogador">Aventureiro</span></p>
                    <p>Nível: <span id="nivel-jogador">1</span></p>
                    <p>XP: <span id="xp-jogador">0</span> / <span id="xp-proximo-nivel-jogador">100</span></p>
                    <hr style="border-top: 1px solid #555;">
                    <p>HP: <span id="hp-jogador">100</span>/<span id="hp-max-jogador">100</span></p>
                    <p>MP: <span id="mp-jogador">50</span>/<span id="mp-max-jogador">50</span></p>
                    <hr style="border-top: 1px solid #555;">
                    <p>Força: <span id="forca-jogador">10</span></p>
                    <p>Destreza: <span id="destreza-jogador">10</span></p>
                    <p>Inteligência: <span id="inteligencia-jogador">10</span></p>
                    <p>Carisma: <span id="carisma-jogador">10</span></p>
                    <hr style="border-top: 1px solid #555;">
                    <p>Ouro: <span id="ouro-jogador">10</span></p>
                </div>
            </div>
        </main>

        <footer class="text-center mt-5">
            <p>&copy; 2023-2024 RPG de Texto Interativo. Inspirado pela paixão por contar histórias.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
