<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Imagens Estilo Mangá/Anime</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 20px 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 800px;
        }
        h1 {
            color: #343a40;
            margin-bottom: 30px;
            font-weight: bold;
        }
        #imageContainer {
            min-height: 200px;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            margin-bottom: 20px;
            position: relative;
        }
        #imageContainer img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #imageContainer .status-text {
            color: #6c757d;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
        #imageContainer .loading {
            color: #007bff;
            font-weight: bold;
        }
        #imageContainer .error {
            color: #dc3545;
        }
        #imageContainer .success {
            color: #28a745;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
            font-weight: bold;
            padding: 12px;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #0056b3;
            border-color: #0056b3;
        }
        .btn-primary:disabled {
            background-color: #6c757d;
            border-color: #6c757d;
        }
        .api-status {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .api-status h5 {
            margin-bottom: 10px;
            color: #0c5460;
        }
        textarea {
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">🎨 Gerador de Imagens Estilo Mangá/Anime</h1>
        
        <div class="api-status">
            <h5>✨ APIs Gratuitas Ativadas!</h5>
            <p class="mb-0">Usando <strong>Pollinations.ai</strong> e <strong>Hugging Face</strong> - 100% gratuito, sem necessidade de chaves API!</p>
        </div>

        <div class="form-group">
            <label for="dialogueText"><strong>Texto do Diálogo:</strong></label>
            <textarea id="dialogueText" class="form-control" rows="3" placeholder="Ex: Vamos lutar juntos!"></textarea>
        </div>
        
        <div class="form-group">
            <label for="thoughtText"><strong>Texto do Pensamento:</strong></label>
            <textarea id="thoughtText" class="form-control" rows="3" placeholder="Ex: Será que conseguiremos vencer?"></textarea>
        </div>
        
        <div class="form-group">
            <label for="scenarioDescription"><strong>Descrição do Cenário:</strong></label>
            <textarea id="scenarioDescription" class="form-control" rows="3" placeholder="Ex: Campo de batalha épico ao pôr do sol"></textarea>
        </div>
        
        <div class="form-group">
            <label for="characterAppearance"><strong>Aparência e Vestimenta do Personagem:</strong></label>
            <textarea id="characterAppearance" class="form-control" rows="3" placeholder="Ex: Jovem guerreiro com armadura dourada e espada brilhante"></textarea>
        </div>
        
        <div class="form-group">
            <label for="artStyle"><strong>Estilo de Arte:</strong></label>
            <select id="artStyle" class="form-control">
                <option value="manga">Gamon Sakurai (Mangá)</option>
                <option value="realistic">Fotorrealista</option>
                <option value="anime">Anime Moderno</option>
                <option value="fantasy">Fantasy Art</option>
            </select>
        </div>
        
        <div class="form-group">
            <label><strong>Imagem Gerada:</strong></label>
            <div id="imageContainer">
                <span class="status-text">Nenhuma imagem gerada ainda. Preencha os campos e clique em "Gerar Imagem"!</span>
            </div>
        </div>
        
        <button id="generateImageButton" class="btn btn-primary btn-block mb-3">
            🎨 Gerar Imagem
        </button>
        
        <div class="form-group">
            <label for="uploadImage"><strong>Substituir por Imagem Local:</strong></label>
            <input type="file" id="uploadImage" class="form-control-file" accept="image/*">
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    
    <script>
        // NOVO SCRIPT COM APIs GRATUITAS - NÃO PRECISA DE CHAVE API!
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🎨 Gerador de Mangá Carregado - APIs Gratuitas Ativadas!');
            
            // Elementos do DOM
            const dialogueTextElement = document.getElementById('dialogueText');
            const thoughtTextElement = document.getElementById('thoughtText');
            const scenarioDescriptionElement = document.getElementById('scenarioDescription');
            const characterAppearanceElement = document.getElementById('characterAppearance');
            const artStyleElement = document.getElementById('artStyle');
            const generateImageButton = document.getElementById('generateImageButton');
            const imageContainer = document.getElementById('imageContainer');
            const uploadImageElement = document.getElementById('uploadImage');

            // Função para exibir conteúdo no container de imagem
            function displayInImageContainer(options = {}) {
                const { imageUrl, isLoading = false, message = '', altText = 'Imagem Gerada', isError = false, isSuccess = false } = options;

                if (!imageContainer) {
                    console.error("Elemento 'imageContainer' não encontrado.");
                    return;
                }

                if (isLoading) {
                    imageContainer.innerHTML = '<span class="status-text loading">🎨 Gerando imagem, por favor aguarde...</span>';
                } else if (imageUrl) {
                    imageContainer.innerHTML = `<img src="${imageUrl}" alt="${altText}">`;
                } else if (message) {
                    let className = 'status-text';
                    if (isError) className += ' error';
                    if (isSuccess) className += ' success';
                    imageContainer.innerHTML = `<span class="${className}">${message}</span>`;
                } else {
                    imageContainer.innerHTML = '<span class="status-text">Não foi possível exibir a imagem.</span>';
                }
            }

            // Função para gerar imagem com Pollinations.ai (gratuita)
            async function generateImageWithPollinations(prompt) {
                try {
                    console.log('🎨 Tentando Pollinations.ai...');
                    const encodedPrompt = encodeURIComponent(prompt);
                    const seed = Math.floor(Math.random() * 1000000);
                    const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&seed=${seed}&model=flux`;
                    
                    return new Promise((resolve, reject) => {
                        const img = new Image();
                        img.onload = () => {
                            console.log('✅ Pollinations.ai funcionou!');
                            resolve(imageUrl);
                        };
                        img.onerror = () => {
                            console.log('❌ Pollinations.ai falhou');
                            reject(new Error('Falha ao carregar imagem do Pollinations'));
                        };
                        // Timeout de 15 segundos
                        setTimeout(() => {
                            reject(new Error('Timeout do Pollinations'));
                        }, 15000);
                        img.src = imageUrl;
                    });
                } catch (error) {
                    console.error('Erro Pollinations:', error);
                    throw error;
                }
            }

            // Função para gerar imagem com Hugging Face (gratuita)
            async function generateImageWithHuggingFace(prompt) {
                try {
                    console.log('🤖 Tentando Hugging Face...');
                    const response = await fetch(
                        "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-2-1",
                        {
                            headers: {
                                "Content-Type": "application/json",
                            },
                            method: "POST",
                            body: JSON.stringify({
                                inputs: prompt,
                                parameters: {
                                    negative_prompt: "blurry, low quality, distorted, ugly, bad anatomy",
                                    num_inference_steps: 30,
                                    guidance_scale: 7.5
                                }
                            }),
                        }
                    );

                    if (!response.ok) {
                        throw new Error(`Erro HTTP: ${response.status}`);
                    }

                    const blob = await response.blob();
                    console.log('✅ Hugging Face funcionou!');
                    return URL.createObjectURL(blob);
                } catch (error) {
                    console.error('❌ Erro Hugging Face:', error);
                    throw error;
                }
            }

            // Event listener para o botão "Gerar Imagem"
            if (generateImageButton) {
                generateImageButton.addEventListener('click', async () => {
                    generateImageButton.disabled = true;
                    displayInImageContainer({ isLoading: true });

                    try {
                        // Coletar dados dos campos
                        const dialogo = dialogueTextElement ? dialogueTextElement.value.trim() : '';
                        const pensamento = thoughtTextElement ? thoughtTextElement.value.trim() : '';
                        const cenario = scenarioDescriptionElement ? scenarioDescriptionElement.value.trim() : '';
                        const personagem = characterAppearanceElement ? characterAppearanceElement.value.trim() : '';
                        const estilo = artStyleElement ? artStyleElement.value : 'manga';

                        // Construir prompt
                        let promptText = '';
                        
                        if (cenario) {
                            promptText += cenario;
                        }
                        if (personagem) {
                            promptText += (promptText ? ', ' : '') + personagem;
                        }
                        if (dialogo) {
                            promptText += (promptText ? ', ' : '') + `character speaking: "${dialogo}"`;
                        }
                        if (pensamento) {
                            promptText += (promptText ? ', ' : '') + `character thinking: "${pensamento}"`;
                        }

                        // Prompt padrão se nada foi preenchido
                        if (!promptText.trim()) {
                            promptText = "anime character, manga style, detailed artwork";
                        }

                        // Adicionar estilo específico
                        switch(estilo) {
                            case "manga":
                                promptText += ", manga style by Gamon Sakurai, black and white manga art, detailed lineart, shonen manga";
                                break;
                            case "realistic":
                                promptText += ", photorealistic, detailed, high quality, realistic photography";
                                break;
                            case "anime":
                                promptText += ", modern anime style, colorful, detailed anime art, studio quality";
                                break;
                            case "fantasy":
                                promptText += ", fantasy art, magical, epic, detailed fantasy illustration, vibrant colors";
                                break;
                            default:
                                promptText += ", detailed artwork, high quality";
                        }

                        console.log("🎨 Gerando imagem com prompt:", promptText);

                        let imageUrl = null;
                        let errors = [];

                        // Tentar Pollinations primeiro
                        try {
                            imageUrl = await generateImageWithPollinations(promptText);
                        } catch (error) {
                            errors.push(`Pollinations: ${error.message}`);
                        }
                        
                        // Se falhou, tentar Hugging Face
                        if (!imageUrl) {
                            try {
                                imageUrl = await generateImageWithHuggingFace(promptText);
                            } catch (error) {
                                errors.push(`Hugging Face: ${error.message}`);
                            }
                        }

                        if (imageUrl) {
                            displayInImageContainer({ 
                                imageUrl: imageUrl, 
                                altText: "Imagem Gerada - Estilo Mangá/Anime"
                            });
                        } else {
                            console.error('Todas as APIs falharam:', errors);
                            displayInImageContainer({ 
                                message: "❌ Erro ao gerar imagem. Tente novamente em alguns minutos. As APIs gratuitas podem ter limitações temporárias.", 
                                isError: true 
                            });
                        }

                    } catch (error) {
                        console.error("Erro geral:", error);
                        displayInImageContainer({ 
                            message: `❌ Erro inesperado: ${error.message}`, 
                            isError: true 
                        });
                    } finally {
                        generateImageButton.disabled = false;
                    }
                });
            }

            // Event listener para upload de arquivo
            if (uploadImageElement) {
                uploadImageElement.addEventListener('change', (event) => {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            displayInImageContainer({ 
                                imageUrl: e.target.result, 
                                altText: "Imagem Carregada pelo Usuário" 
                            });
                        }
                        reader.onerror = (error) => {
                            console.error("Erro ao ler arquivo:", error);
                            displayInImageContainer({ 
                                message: "❌ Erro ao carregar imagem local.", 
                                isError: true 
                            });
                        };
                        reader.readAsDataURL(file);
                    }
                });
            }

            // Teste de conectividade
            async function testAPIs() {
                console.log("🔍 Testando conectividade das APIs...");
                try {
                    const testResponse = await fetch("https://image.pollinations.ai/prompt/test?width=10&height=10", { method: 'HEAD' });
                    if (testResponse.ok) {
                        console.log("✅ Pollinations.ai disponível");
                    }
                } catch (error) {
                    console.log("⚠️ Pollinations.ai pode estar indisponível:", error.message);
                }
            }

            // Inicializar
            testAPIs();
            console.log("🚀 Sistema pronto! Nenhuma chave API necessária!");
        });
    </script>
</body>
</html>
